# Credenciamento DIANOT no nginx do asent-jur (mesma VM, portas 80/443).
# Colar dentro do bloco http { ... } de
# C:\Users\joao.siviero\asent-jur\projeto\nginx\nginx.conf, antes do server do
# asent-jur, e trocar o domínio. Ver deploy/README.md, passo 7.
#
# O server_name específico faz o nginx mandar só esse domínio para o
# credenciamento; os demais acessos continuam indo para o asent-jur (server_name _).

server {
    listen 80;
    server_name credenciamento.codego.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name credenciamento.codego.com.br;

    ssl_certificate     /etc/nginx/certs/credenciamento.crt;
    ssl_certificate_key /etc/nginx/certs/credenciamento.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Documentos de até 10 MB por arquivo.
    client_max_body_size 15M;

    # Os cabeçalhos de segurança (CSP etc.) vêm do próprio backend.
    location / {
        # O backend do credenciamento publica a porta 8081 na VM.
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
