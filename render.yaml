# Blueprint do Render (plano grátis). Um serviço só: o backend serve a API e o
# site (SERVIR_FRONTEND=true). Banco MySQL externo (ex.: Aiven).
services:
  - type: web
    name: credenciamento-dianot
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SERVIR_FRONTEND
        value: "true"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_SSL_CA
        sync: false
      - key: RECAPTCHA_ENABLED
        value: "false"
      - key: RECAPTCHA_SECRET_KEY
        sync: false
