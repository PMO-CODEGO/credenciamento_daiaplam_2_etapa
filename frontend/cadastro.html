<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Credenciamento DIANOT</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
</head>
<body>
  <div class="page">
    <header class="letterhead">
      <a class="letterhead__home" href="index.html" title="Voltar para a tela inicial"><img class="letterhead__mark" src="assets/brasao_codego.png" alt="CODEGO"></a>
      <div class="letterhead__text">
        <p class="letterhead__org">Companhia de Desenvolvimento Econômico de Goiás</p>
        <h1 class="letterhead__title">Credenciamento DIANOT — 2ª etapa</h1>
      </div>
    </header>
    <main class="card">
      <div class="card__intro">
        <h2 class="card__title">Cadastro de usuário</h2>
        <p class="card__desc">Seu login de acesso será o CNPJ da empresa. A senha é gerada automaticamente pelo sistema e mostrada ao final do cadastro.</p>
      </div>

      <form id="form-cadastro" novalidate>
        <div class="field">
          <label for="cnpj">CNPJ (será o seu login)</label>
          <input type="text" id="cnpj" name="cnpj" inputmode="numeric" autocomplete="username" maxlength="18" placeholder="00.000.000/0000-00">
          <p class="field__error" data-error-for="cnpj"></p>
        </div>

        <div class="field">
          <label for="nome_empresarial">Nome da empresa (Razão Social)</label>
          <input type="text" id="nome_empresarial" name="nome_empresarial" autocomplete="organization" maxlength="255">
          <p class="field__error" data-error-for="nome_empresarial"></p>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" maxlength="255">
          <p class="field__error" data-error-for="email"></p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="representante_nome">Representante Legal (nome completo)</label>
            <input type="text" id="representante_nome" name="representante_nome" autocomplete="name" maxlength="255">
            <p class="field__error" data-error-for="representante_nome"></p>
          </div>
          <div class="field">
            <label for="representante_cpf">CPF do Representante Legal</label>
            <input type="text" id="representante_cpf" name="representante_cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off">
            <p class="field__error" data-error-for="representante_cpf"></p>
          </div>
        </div>

        <div class="field">
          <div id="recaptcha"></div>
          <p class="field__error" data-error-for="recaptcha"></p>
        </div>

        <div class="feedback feedback--error" id="feedback" hidden></div>

        <div class="card__footer">
          <button type="submit" class="btn-primary" id="btn-enviar">Cadastrar</button>
          <p class="card__footer-note">Já tem login? <a href="index.html">Entrar</a></p>
        </div>
      </form>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script>CodegoAuth.iniciarCadastro();</script>
</body>
</html>
