# Blueprint de TESTE do Render: plano GRATUITO, sem cartão e SEM disco persistente.
# Serve para validar banco, reCAPTCHA, cadastro, e-mail da Brevo e comprovante.
# ATENÇÃO: os documentos enviados são APAGADOS a cada deploy/reinício e o serviço "dorme" sem uso.
# Para empresas reais, use o render.yaml (plano pago com disco).
services:
  - type: web
    name: credenciamento-daiaplam
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SERVIR_FRONTEND
        value: "true"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_SSL_CA
        sync: false
      - key: RECAPTCHA_ENABLED
        value: "true"
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: STORAGE_DIR
        value: /app/storage
      - key: EMAIL_PROVIDER
        value: brevo_api
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
